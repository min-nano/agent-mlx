#
# project.yml — XcodeGen のプロジェクト定義。
#
# なぜ Xcode プロジェクトが要るのか
# --------------------------------
# iOS の .app は SwiftPM だけでは作れない（swift build が作るのは素の実行
# ファイルで、バンドル・Info.plist・アセットカタログの面倒は見ない）。両 OS の
# アプリを同じ手順でビルドするには xcodebuild が要り、そのためにプロジェクト
# ファイルが要る。
#
# なぜ .xcodeproj をコミットしないのか
# ----------------------------------
# .pbxproj は差分が読めず、競合が解決できず、Xcode が勝手に書き換える。この
# ファイル（人が読める YAML）を原本にして、scripts/generate-xcodeproj.sh が
# 毎回生成する。CI も同じスクリプトを使う。つまり **ここが唯一の定義**。
#
# ターゲット構成（CLAUDE.md「アーキテクチャ」参照）
# ------------------------------------------------
# アプリ 1 つ = 1 モジュールにしてある（Core / Engine / UI を framework に
# 分けていない）。framework に分けると iOS の埋め込みと署名の面倒が増えるわりに、
# 依存の向きの強制は結局 Package.swift 側（swift build / swift test）で効く
# ため。**MLX に依存してよいのは Apps/MLXChatEngine だけ**という規則は、
# Sources/ が MLX 抜きの SwiftPM パッケージとして常にビルドされることで守られる。
#
name: MLXChat

options:
  bundleIdPrefix: com.minnano
  createIntermediateGroups: true
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  # 生成物はリポジトリに入れないので、生成のたびに作り直してよい。
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Swift 6 の厳格な並行性チェックは mlx-swift-lm 側の型（Chat.Message など）が
    # Sendable でないため通らない。言語モードは 5 に固定する。
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    # 署名は「自動」にしておく。**署名を切るのはビルドの都合であって
    # プロジェクトの性質ではない**ので、ここには書かない。
    #
    # ここで CODE_SIGNING_ALLOWED=NO を宣言してしまうと、手元の Xcode から
    # 自分の Apple ID で実機へ入れることができなくなる（未署名のアプリは
    # iOS がインストールを拒否する）。証明書を持たない CI 側だけが
    # scripts/xcode-build.sh のコマンドラインで署名を切る。
    CODE_SIGN_STYLE: Automatic
    # SwiftPM のビルドツールプラグイン（mlx-swift の CudaBuild など）が
    # サンドボックスに引っかからないようにする。
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

packages:
  # mlx-swift-lm 2.x を使う（3.x は MLXHuggingFace のマクロ経由 API へ移行して
  # おり、swift-syntax のビルドが必要になるぶん CI が重くなる）。
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.31.3
  # 推移依存だが、意図しない上がり方をしないよう明示して固定する。
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.6
  # HubApi（重みの置き場所を ModelStorage と揃えるために使う）。
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.2.1

# 3 ターゲットで共有する定義。sources と dependencies の重複を避ける。
targetTemplates:
  MLXTarget:
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub

targets:
  # ---------------------------------------------------------------------
  # iOS アプリ
  # ---------------------------------------------------------------------
  MLXChat-iOS:
    templates: [MLXTarget]
    type: application
    platform: iOS
    sources:
      - path: Sources/MLXChatCore
      - path: Apps/MLXChatEngine
      - path: Apps/MLXChatUI
      - path: Apps/iOS
      - path: packaging/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: MLXChat
        PRODUCT_BUNDLE_IDENTIFIER: com.minnano.mlxchat
        INFOPLIST_FILE: packaging/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # MLX は Metal の GPU family を要求するため iOS シミュレータでは
        # 動かない。実機向けだけをビルドする（CI もそうしている）。
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: "NO"

  # ---------------------------------------------------------------------
  # macOS アプリ
  # ---------------------------------------------------------------------
  MLXChat-macOS:
    templates: [MLXTarget]
    type: application
    platform: macOS
    sources:
      - path: Sources/MLXChatCore
      - path: Sources/MLXChatUpdater
      - path: Apps/MLXChatEngine
      - path: Apps/MLXChatUI
      - path: Apps/macOS
      - path: packaging/Assets.xcassets
      # 自動アップデートの差し替えスクリプト。UpdaterService が
      # Contents/Resources/install-update.sh を探す（対で扱うこと）。
      - path: scripts/install-update.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MLXChat
        PRODUCT_BUNDLE_IDENTIFIER: com.minnano.mlxchat
        INFOPLIST_FILE: packaging/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # MLX は Apple Silicon 専用（Intel Mac には Metal の GPU family が無い）。
        # ユニバーサルにしても動かないので arm64 だけをビルドする。
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"

  # ---------------------------------------------------------------------
  # CLI
  #
  # 配布物では macOS アプリの Contents/MacOS へ同梱する（build.yml の
  # "Bundle the CLI into the app" ステップ）。Xcode のターゲット依存で
  # コピーさせないのは、ツールターゲットの copy/link の扱いが XcodeGen と
  # Xcode のバージョンで揺れるため — 同梱の有無は build.yml の同梱チェックが
  # 保証する（対で扱うこと）。
  # ---------------------------------------------------------------------
  mlxchat-cli:
    templates: [MLXTarget]
    type: tool
    platform: macOS
    sources:
      - path: Sources/MLXChatCore
      - path: Apps/MLXChatEngine
      - path: Apps/cli
    settings:
      base:
        PRODUCT_NAME: mlxchat-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.minnano.mlxchat.cli
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"

schemes:
  MLXChat-iOS:
    build:
      targets:
        MLXChat-iOS: all
  MLXChat-macOS:
    build:
      targets:
        MLXChat-macOS: all
  mlxchat-cli:
    build:
      targets:
        mlxchat-cli: all
